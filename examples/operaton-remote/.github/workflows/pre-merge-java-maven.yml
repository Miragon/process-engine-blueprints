name: Pre-Merge Checks · Java/Maven

on:
  pull_request:
    branches: [ main ]

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend build + contract drift (Java/Maven)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Lint BPMN (bpmnlint)
        run: |
          npm ci
          npm run lint:bpmn

      - name: Set up JDK 21
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Build (arch + checkstyle + unit + process + model validation + spec export)
        working-directory: java-maven
        run: ./mvnw -B -ntp verify

      # The OpenAPI spec is generated by a test and committed; fail if the code and the checked-in
      # contract have drifted. Both variants export to the same file, so this also proves they expose
      # the same API. See docs/adr/0003-openapi-as-the-checked-in-contract.md.
      - name: Verify the committed OpenAPI contract is in sync
        run: git diff --exit-code -- openapi/openapi.json

  bruno:
    name: Bruno end-to-end scenarios (Java/Maven)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18.4
        env:
          POSTGRES_DB: bikeleasing_engine
          POSTGRES_USER: admin
          POSTGRES_PASSWORD: admin
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U admin -d bikeleasing_engine"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Create the worker's domain database
        run: PGPASSWORD=admin psql -h localhost -U admin -d bikeleasing_engine -c 'CREATE DATABASE bikeleasing_app;'

      - name: Set up JDK 21
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '22'

      - name: Package the applications
        working-directory: java-maven
        run: ./mvnw -B -ntp -DskipTests -Dcheckstyle.skip package

      - name: Start the engine host (engine-service)
        working-directory: java-maven
        run: java -jar service/engine-service/target/engine-service-1.0-SNAPSHOT.jar > "$GITHUB_WORKSPACE/engine.log" 2>&1 &

      - name: Wait for the engine to be ready
        run: |
          for i in $(seq 1 100); do
            if curl -sf http://localhost:8081/engine-rest/engine > /dev/null; then
              echo "Engine is up"; exit 0
            fi
            sleep 3
          done
          echo "Engine did not start in time"; tail -n 200 engine.log; exit 1

      - name: Start the worker (example-service)
        working-directory: java-maven
        run: java -jar service/example-service/target/example-service-1.0-SNAPSHOT.jar > "$GITHUB_WORKSPACE/worker.log" 2>&1 &

      - name: Wait for the worker to be ready
        run: |
          for i in $(seq 1 100); do
            code=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:8082/api/bike-leasing/00000000-0000-0000-0000-000000000000 || true)
            if [ "$code" != "000" ]; then
              echo "Worker is up (HTTP $code)"; exit 0
            fi
            sleep 3
          done
          echo "Worker did not start in time"; tail -n 200 worker.log; exit 1

      - name: Run Bruno scenarios
        working-directory: bruno
        run: npx --yes @usebruno/cli@4.0.0 run . --env local -r --exclude-tags=demo-data

      - name: Dump application logs on failure
        if: failure()
        run: |
          echo "===== engine.log ====="; tail -n 300 engine.log
          echo "===== worker.log ====="; tail -n 300 worker.log
