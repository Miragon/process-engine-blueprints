name: Release

# release-please keeps one release PR per example (component). Merging it tags `<example>-v<version>`,
# creates the GitHub release, and the starters job attaches one archive per variant to it — what
# `npm create miragon-blueprint` downloads. `workflow_dispatch` (re)builds the starters of a release by
# hand, and creates the release if it does not exist yet (how the first releases are bootstrapped).
on:
  push:
    branches: [ main ]
  workflow_dispatch:
    inputs:
      examples:
        description: 'Examples to release, space-separated, or "all"'
        required: true
        default: all

permissions:
  contents: read

jobs:
  release-please:
    name: Release PRs and releases
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    outputs:
      released: ${{ steps.released.outputs.examples }}
      cli-released: ${{ steps.release.outputs['tooling/create-blueprint--release_created'] }}
    steps:
      - name: Run release-please
        id: release
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

      - name: List the examples released by this run
        id: released
        env:
          PATHS: ${{ steps.release.outputs.paths_released || '[]' }}
        run: echo "examples=$(jq -c '[.[] | select(startswith("examples/")) | ltrimstr("examples/")]' <<< "$PATHS")" >> "$GITHUB_OUTPUT"

  select:
    name: Select the examples to build starters for
    needs: release-please
    if: always() && (github.event_name == 'workflow_dispatch' || needs.release-please.outputs.released != '[]')
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: One entry per example and variant
        id: matrix
        env:
          RELEASED: ${{ needs.release-please.outputs.released }}
          REQUESTED: ${{ inputs.examples }}
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            if [[ "$REQUESTED" == "all" ]]; then
              examples=$(for blueprint in examples/*/blueprint.yaml; do basename "$(dirname "$blueprint")"; done)
            else
              examples=$REQUESTED
            fi
          else
            examples=$(jq -r '.[]' <<< "$RELEASED")
          fi
          for example in $examples; do
            version=$(jq -r --arg path "examples/$example" '.[$path]' .release-please-manifest.json)
            for variant in $(yq '.variants | keys | .[]' "examples/$example/blueprint.yaml"); do
              jq -nc --arg example "$example" --arg variant "$variant" --arg tag "$example-v$version" \
                '{example: $example, variant: $variant, tag: $tag}'
            done
          done | jq -sc '{include: .}' > matrix.json
          echo "matrix=$(cat matrix.json)" >> "$GITHUB_OUTPUT"

  starters:
    name: Starter ${{ matrix.example }} (${{ matrix.variant }})
    needs: select
    if: always() && needs.select.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    strategy:
      fail-fast: false
      max-parallel: 6
      matrix: ${{ fromJSON(needs.select.outputs.matrix) }}
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Export the starter
        run: tooling/starter/export.sh "${{ matrix.example }}" "${{ matrix.variant }}" "$RUNNER_TEMP/starter"

      - name: Pack it as tar.gz (for the CLI) and zip
        env:
          ASSET: ${{ matrix.example }}-${{ matrix.variant }}
        run: |
          cd "$RUNNER_TEMP/starter"
          rm -rf .git
          tar -czf "$RUNNER_TEMP/$ASSET.tar.gz" .
          zip -qr "$RUNNER_TEMP/$ASSET.zip" .

      - name: Create the release if it does not exist yet
        if: github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ matrix.tag }}
        run: |
          gh release view "$TAG" > /dev/null 2>&1 \
            || gh release create "$TAG" --target "$GITHUB_SHA" --title "$TAG" --notes "Starters of ${{ matrix.example }}." \
            || gh release view "$TAG" > /dev/null

      - name: Attach the starters to the release
        env:
          GH_TOKEN: ${{ github.token }}
          ASSET: ${{ matrix.example }}-${{ matrix.variant }}
        run: gh release upload "${{ matrix.tag }}" "$RUNNER_TEMP/$ASSET.tar.gz" "$RUNNER_TEMP/$ASSET.zip" --clobber

  publish-cli:
    name: Publish create-miragon-blueprint
    needs: release-please
    # npm provenance needs a public repository; trusted publishing replaces an NPM_TOKEN.
    if: needs.release-please.outputs.cli-released == 'true' && !github.event.repository.private
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    defaults:
      run:
        working-directory: tooling/create-blueprint
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'

      - name: Test
        run: npm test

      - name: Publish with provenance (OIDC trusted publishing)
        run: |
          version=$(node -p 'require("./package.json").version')
          if npm view "create-miragon-blueprint@$version" version > /dev/null 2>&1; then
            echo "create-miragon-blueprint@$version is already published"
          else
            npm publish --provenance --access public
          fi
