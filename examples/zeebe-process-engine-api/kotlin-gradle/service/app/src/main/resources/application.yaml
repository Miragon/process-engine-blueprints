server:
  # 8080 is taken by the Camunda 8 web apps (Operate/Tasklist) in the local stack.
  port: 8081

spring:
  datasource:
    # Overridable via SPRING_DATASOURCE_* env vars for containerized/remote runs; the defaults target
    # the local dev Postgres (stack/docker-compose.yml). See CONTRIBUTING.md "Run it in containers".
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/bikeleasing}
    username: ${SPRING_DATASOURCE_USERNAME:admin}
    password: ${SPRING_DATASOURCE_PASSWORD:admin}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      # Flyway owns the schema (resources/db/migration); Hibernate only validates the entities against it.
      ddl-auto: validate
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
  mvc:
    problemdetails:
      enabled: true

# The Zeebe connection (self-managed, gRPC 26500 / REST 8080, auth none) and the BPMN/DMN/form
# auto-deployment are contributed by the common-zeebe module (zeebe-application.yaml +
# EngineAutoConfiguration).

# process-engine-api (bpm-crafters): runs the Camunda 8 adapter, which opens job workers for the
# @ProcessEngineWorker beans and polls the user tasks for the UserTaskSupport pool. The worker library's
# own deployment stays off: it covers BPMN and DMN only, and the models reference deployed forms.
dev:
  bpm-crafters:
    process-api:
      worker:
        deployment:
          enabled: false
      adapter:
        c8:
          enabled: true
          service-tasks:
            delivery-strategy: subscription
            worker-id: leasing-worker
            # Failed jobs count down to an incident: applies to every service task (docs/adr/0014).
            retries: 3
            retry-timeout-in-seconds: 10
          user-tasks:
            delivery-strategy: scheduled
            schedule-delivery-fixed-rate-in-seconds: 1

# A minimal, deploy/ops-ready surface. Everything else stays disabled.
management:
  endpoints:
    web:
      exposure:
        include: health, info, metrics, prometheus
  endpoint:
    health:
      probes:
        enabled: true
      # Component detail is hidden. To expose it, set: show-details: always
      show-details: never
  health:
    livenessstate:
      enabled: true
    readinessstate:
      enabled: true

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
  # Only the application's own /api/** surface is part of the published contract.
  paths-to-match: /api/**

logging:
  level:
    io.camunda.zeebe.client.impl.ZeebeCallCredentials: ERROR
