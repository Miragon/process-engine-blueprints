# Generated by `npm run generate` from examples/*/blueprint.yaml. Do not edit: change the source and regenerate.
name: Nightly
on:
  schedule:
    - cron: 0 3 * * *
  workflow_dispatch: {}
permissions:
  contents: read
jobs:
  changes:
    name: Select the examples to check
    runs-on: ubuntu-latest
    outputs:
      examples: ${{ steps.select.outputs.examples }}
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Install the maintainer tooling
        run: npm ci
      - name: Every example on Sundays and on demand, otherwise the ones changed in the last day
        id: select
        run: |-
          if [[ "${{ github.event_name }}" == "workflow_dispatch" || "$(date -u +%u)" == "7" ]]; then
            selection=$(node scripts/changed-examples.mjs --all)
          else
            since=$(git rev-list -n1 --before="25 hours ago" HEAD || true)
            selection=$(node scripts/changed-examples.mjs "${since:-}" HEAD --shared-tooling-selects-all)
          fi
          echo "$selection"
          echo "$selection" >> "$GITHUB_OUTPUT"
  cibseven-embedded--nightly-java-maven:
    name: cibseven-embedded · Nightly Checks · Java/Maven
    needs: changes
    if: contains(fromJSON(needs.changes.outputs.examples), 'cibseven-embedded')
    uses: ./.github/workflows/cibseven-embedded.nightly-java-maven.yml
  cibseven-embedded--nightly-kotlin-gradle:
