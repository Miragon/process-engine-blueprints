# Generated by `npm run generate` from examples/zeebe-native/.github/workflows/nightly-kotlin-gradle.yml. Do not edit: change the source and regenerate.
name: zeebe-native · Nightly Checks · Kotlin/Gradle

on:
  workflow_call: {}
defaults:
  run:
    working-directory: examples/zeebe-native
jobs:
  mutation:
    name: Domain mutation testing (PIT, gate 80)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up JDK 21
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1

      - name: Run PIT mutation testing
        working-directory: examples/zeebe-native/kotlin-gradle
        run: ./gradlew :service:app:pitest --no-daemon

      - name: Upload mutation report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: zeebe-native-pitest-report-kotlin-gradle
          path: examples/zeebe-native/kotlin-gradle/service/app/build/reports/pitest
          if-no-files-found: warn

  bruno:
    name: Bruno end-to-end scenarios
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up JDK 21
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'

      # Camunda 8 self-managed stack (Zeebe + Operate/Tasklist, Elasticsearch) and Postgres.
      - name: Start the Camunda 8 stack
        run: docker compose -f stack/docker-compose.yml up -d

      - name: Wait for Zeebe to be ready
        run: |
          for i in $(seq 1 60); do
            if curl -sf http://localhost:9600/actuator/health > /dev/null; then
              echo "Zeebe is up"; exit 0
            fi
            sleep 5
          done
          echo "Zeebe did not start in time"; docker compose -f stack/docker-compose.yml logs --tail 200; exit 1

      - name: Start the application
        working-directory: examples/zeebe-native/kotlin-gradle
        run: (./gradlew :service:app:bootRun --no-daemon) > "$GITHUB_WORKSPACE/examples/zeebe-native/app.log" 2>&1 &

      - name: Wait for the application to be ready
        run: |
          for i in $(seq 1 60); do
            if curl -sf http://localhost:8081/actuator/health/readiness > /dev/null; then
              echo "Application is up"; exit 0
            fi
            sleep 3
          done
          echo "Application did not start in time"; tail -n 200 app.log; exit 1

      - name: Run Bruno scenarios
        working-directory: examples/zeebe-native/bruno
        # Pin the CLI: sandbox capabilities (available globals, require whitelist)
        # can change between majors, so an unpinned "latest" is a correctness risk,
        # not just a supply-chain one. The polling helpers rely on require('axios').
        run: npx --yes @usebruno/cli@4.0.0 run . --env local -r --exclude-tags=demo-data

      - name: Dump application log on failure
        if: failure()
        run: tail -n 300 app.log

      - name: Dump stack logs on failure
        if: failure()
        run: docker compose -f stack/docker-compose.yml logs --tail 300
