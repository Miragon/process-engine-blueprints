# How far the examples may drift apart. `npm run drift` (CI and the pre-commit hook) fails unless every file of
# every example is either identical to its copies in other examples (listed in the generated drift.lock.yml) or
# listed here with a reason. Both variants of an example must also have the same source files and the same test
# methods (languageOnly lists the exceptions) and identical identicalResources (blueprint.yaml).
#
# Paths are compared per language: kotlin-gradle/ only with kotlin-gradle/, java-maven/ only with java-maven/.
# A single-variant example with its variant at the root (path: . in blueprint.yaml) has its service/ compared
# as <variant>/service/.
#
# engines:      spellings replaced by {engine} before comparing, so copies that differ only in the engine name
#               count as identical; paths and globs below use {engine} too.
# independent:  never compared, because Dependabot bumps them per example.
# differs:      compared, may differ, reason required; an entry whose files are all identical again fails.
# languageOnly: sources (path without src/<lang> and extension) or tests (<source>#<name>) in one variant only.
#               Test names are compared by @DisplayName or method name, ignoring case and punctuation, with
#               null and empty treated alike (Kotlin returns null where Java returns Optional.empty()).
#
# After a change: npm run drift:update to refresh drift.lock.yml, then npm run drift.
engines:
  cibseven: [cibseven, Cibseven, cib-seven, CIB seven, CIB-seven]
  operaton: [operaton, Operaton, OPERATON]
  fluxnova: [finos.fluxnova, fluxnova, Fluxnova]
independent:
  - files: ["**/gradlew", "**/gradlew.bat", "**/mvnw", "**/mvnw.cmd", "**/gradle-wrapper.jar", "**/gradle-wrapper.properties", "**/maven-wrapper.properties", "**/package.json", "**/package-lock.json", "**/docker-compose*.yml", ".github/dependabot.yml", "**/pom.xml", "**/*.gradle.kts", "**/libs.versions.toml", ".github/workflows/**", "!.github/workflows/dependabot-automerge.yml"]
    reason: "Dependabot bumps these per example, so a version can be ahead in one example for a while."
