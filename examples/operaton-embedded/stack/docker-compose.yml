# Local development stack. Not intended for production use.
#
# Services:
#   - postgres          : the bike-leasing engine database (Operaton stores its state here)
#   - enterpriseglue-*  : EnterpriseGlue "The Bridge" — an additional web UI for Operaton to
#                         design, deploy and manage BPMN/DMN processes. Open http://localhost:8081.
#                         The Bridge backend talks to the engine's REST API at
#                         http://host.docker.internal:8080/engine-rest (register it under
#                         Platform Settings -> Engines). All secrets below are throwaway dev values.
services:
  postgres:
    image: postgres:18.6
    container_name: bikeleasing-postgres
    ports:
      - "5432:5432"
    restart: always
    environment:
      POSTGRES_DB: bikeleasing
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: admin

  # --- EnterpriseGlue "The Bridge" — additional Operaton UI (http://localhost:8081) ---

  enterpriseglue-db:
    image: postgres:18-alpine
    container_name: enterpriseglue-db
    restart: always
    # No host port published: the Bridge's own database stays internal (no clash with 5432).
    environment:
      POSTGRES_USER: enterpriseglue
      POSTGRES_PASSWORD: enterpriseglue
      POSTGRES_DB: enterpriseglue
    volumes:
      - enterpriseglue_postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U enterpriseglue -d enterpriseglue -h 127.0.0.1"]
      interval: 5s
      timeout: 5s
      retries: 20
    networks:
      - enterpriseglue-network

  enterpriseglue-backend:
    image: ghcr.io/enterpriseglue/enterpriseglue-the-bridge-oss-backend:v0.19.2
    container_name: enterpriseglue-backend
    restart: always
    init: true
    # Lets the backend reach the Operaton engine running on the host (Linux + Docker Desktop).
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      enterpriseglue-db:
        condition: service_healthy
    volumes:
      - enterpriseglue_git_repos:/app/data/repos
    expose:
      - "8787"
    environment:
      NODE_ENV: production
      API_PORT: "8787"
      API_BASE_URL: ""            # empty -> same-origin API calls through the frontend's Nginx proxy
      # --- Outbound engine policy (fail-closed since v0.19.x) ---
      # The engine runs on the host over plain HTTP (a private-network host), so it must be
      # allowlisted explicitly, private hosts opted in, and the insecure-HTTP override enabled.
      # Register the engine at http://host.docker.internal:8080/engine-rest in the Bridge UI.
      EG_ENGINE_ALLOWED_HOSTS: host.docker.internal
      EG_ENFORCE_ENGINE_ENDPOINT_POLICY: "true"
      EG_ENGINE_ALLOW_PRIVATE_HOSTS: "true"
      EG_ALLOW_INSECURE_ENGINE_HTTP: "true"
      # --- Bridge database (the enterpriseglue-db service above) ---
      DATABASE_TYPE: postgres
      EG_DATABASE_STARTUP_MODE: apply
      EG_RUNTIME_ROLE: all
      POSTGRES_HOST: enterpriseglue-db
      POSTGRES_PORT: "5432"
      POSTGRES_USER: enterpriseglue
      POSTGRES_PASSWORD: enterpriseglue
      POSTGRES_DB: enterpriseglue
      POSTGRES_DATABASE: enterpriseglue
      POSTGRES_SCHEMA: main
      POSTGRES_SSL: "false"
      POSTGRES_SSL_REJECT_UNAUTHORIZED: "false"
      # --- Seeded admin (dev only) — log in to the Bridge with these credentials ---
      # NOTE: the Bridge validates both: ADMIN_EMAIL must be a valid email address and
      # ADMIN_PASSWORD must be at least 8 characters — so a plain "admin"/"admin" is rejected.
      ADMIN_EMAIL: admin@enterpriseglue.com
      ADMIN_PASSWORD: adminadmin
      ADMIN_EMAIL_VERIFICATION_EXEMPT: "true"   # let the seeded admin log in without email verification
      # --- Secrets (throwaway dev values — DO NOT reuse in production) ---
      JWT_SECRET: 2f0669379c5ed25e01ac6565e9c6c29553b7de85fd44a62d25b0e721543bf586
      ENCRYPTION_KEY: 1adb848ccfcecbd574ea5a9affd8596afcfc9feb3c1f8a7929846cc04cb0d547
      # --- Tenancy + Git-backed storage ---
      EG_TENANCY_MODE: single
      GIT_REPOS_PATH: ./data/repos
      GIT_DEFAULT_BRANCH: main
    healthcheck:
      test: ["CMD-SHELL", "node -e \"const p=process.env.API_PORT||'8787';require('http').get('http://127.0.0.1:'+p+'/ready',r=>process.exit(r.statusCode===200?0:1)).on('error',()=>process.exit(1));\""]
      interval: 10s
      timeout: 3s
      retries: 10
    networks:
      - enterpriseglue-network

  enterpriseglue-frontend:
    image: ghcr.io/enterpriseglue/enterpriseglue-the-bridge-oss-frontend:v0.19.2
    container_name: enterpriseglue-frontend
    restart: always
    depends_on:
      enterpriseglue-backend:
        condition: service_healthy
    environment:
      API_UPSTREAM: enterpriseglue-backend:8787
    ports:
      - "8081:8080"   # host 8081 -> avoids the Operaton Cockpit port 8080
    networks:
      - enterpriseglue-network

volumes:
  enterpriseglue_postgres_data:
  enterpriseglue_git_repos:

networks:
  enterpriseglue-network:
    driver: bridge
