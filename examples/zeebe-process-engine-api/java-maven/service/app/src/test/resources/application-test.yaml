spring:
  main:
    web-application-type: none
    allow-bean-definition-overriding: true
  # Tests build the schema from the JPA entities (create-drop) on H2; Flyway (Postgres migrations) is off.
  flyway:
    enabled: false
  datasource:
    url: jdbc:h2:mem:bikeleasing-test;DB_CLOSE_DELAY=-1
    username: sa
    password:
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: create-drop
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect

# The retry countdown of a failed job would outlast the process test's assertion timeout at its 10s.
dev:
  bpm-crafters:
    process-api:
      adapter:
        c8:
          service-tasks:
            retry-timeout-in-seconds: 1
