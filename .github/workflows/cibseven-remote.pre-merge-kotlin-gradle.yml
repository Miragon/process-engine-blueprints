# Generated by `npm run generate` from examples/cibseven-remote/.github/workflows/pre-merge-kotlin-gradle.yml. Do not edit: change the source and regenerate.
name: cibseven-remote · Pre-Merge Checks · Kotlin/Gradle

on:
  workflow_call: {}
defaults:
  run:
    working-directory: examples/cibseven-remote

jobs:
  backend:
    name: Backend build + contract drift
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: examples/cibseven-remote/package-lock.json

      - name: Lint BPMN (bpmnlint)
        run: |
          npm ci
          npm run lint:bpmn

      - name: Set up JDK 21
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6

      - name: Gradle build (arch + unit + process + model validation + spec export)
        working-directory: examples/cibseven-remote/kotlin-gradle
        run: ./gradlew build --no-daemon

      # The OpenAPI spec is generated by a test (OpenApiSpecExportTest) and committed; fail if the
      # code and the checked-in contract have drifted. Both variants export to the same file, so this
      # also proves they expose the same API.
      - name: Verify the committed OpenAPI contract is in sync
        run: git diff --exit-code -- openapi/openapi.json

  mutation:
    name: Mutation testing (PIT, gate 80)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6

      - name: Compute changed backend classes
        id: scope
        run: |
          SOURCES="kotlin-gradle/service/example-service/src/main/kotlin"
          CLASSES=$(git diff --relative --name-only "${{ github.event.pull_request.base.sha }}" HEAD -- "$SOURCES" \
            | grep '\.kt$' \
            | sed -E "s#^$SOURCES/##; s#\.kt\$##; s#/#.#g; s#\$#*#" \
            | paste -sd, -)
          echo "classes=$CLASSES" >> "$GITHUB_OUTPUT"
          echo "Scoped mutation classes: ${CLASSES:-<none — pitest skipped>}"

      - name: Run PIT mutation testing (diff-scoped)
        if: steps.scope.outputs.classes != ''
        working-directory: examples/cibseven-remote/kotlin-gradle
        run: ./gradlew :service:example-service:pitest --no-daemon -PmutationTargetClasses="${{ steps.scope.outputs.classes }}"

      - name: Upload mutation report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: cibseven-remote-pitest-report-kotlin-gradle
          path: examples/cibseven-remote/kotlin-gradle/service/example-service/build/reports/pitest
          if-no-files-found: warn

  bruno:
    name: Bruno end-to-end scenarios
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18.4
        env:
          POSTGRES_DB: bikeleasing_engine
          POSTGRES_USER: admin
          POSTGRES_PASSWORD: admin
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U admin -d bikeleasing_engine" --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Create the worker's domain database
        run: PGPASSWORD=admin psql -h localhost -U admin -d bikeleasing_engine -c 'CREATE DATABASE bikeleasing_app;'

      - name: Set up JDK 21
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6

      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '22'

      - name: Start the engine host (engine-service)
        working-directory: examples/cibseven-remote/kotlin-gradle
        run: ./gradlew :service:engine-service:bootRun --no-daemon > "$GITHUB_WORKSPACE/examples/cibseven-remote/engine.log" 2>&1 &

      - name: Wait for the engine to be ready
        run: |
          for i in $(seq 1 60); do
            if curl -sf http://localhost:8081/engine-rest/engine > /dev/null; then
              echo "Engine is up"; exit 0
            fi
            sleep 3
          done
          echo "Engine did not start in time"; tail -n 200 engine.log; exit 1

      - name: Start the worker (example-service)
        working-directory: examples/cibseven-remote/kotlin-gradle
        run: ./gradlew :service:example-service:bootRun --no-daemon > "$GITHUB_WORKSPACE/examples/cibseven-remote/worker.log" 2>&1 &

      - name: Wait for the worker to be ready
        run: |
          for i in $(seq 1 60); do
            code=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:8082/api/bike-leasing/00000000-0000-0000-0000-000000000000 || true)
            if [ "$code" != "000" ]; then
              echo "Worker is up (HTTP $code)"; exit 0
            fi
            sleep 3
          done
          echo "Worker did not start in time"; tail -n 200 worker.log; exit 1

      - name: Run Bruno scenarios
        working-directory: examples/cibseven-remote/bruno
        run: npx --yes @usebruno/cli@4.0.0 run . --env local -r --exclude-tags=demo-data

      - name: Dump application logs on failure
        if: failure()
        run: |
          echo "===== engine.log ====="; tail -n 300 engine.log
          echo "===== worker.log ====="; tail -n 300 worker.log
