# Generated by `npm run generate` from examples/operaton-process-engine-api/.github/workflows/pre-merge.yml. Do not edit: change the source and regenerate.
name: operaton-process-engine-api · Pre-Merge Checks

on:
  workflow_call: {}
defaults:
  run:
    working-directory: examples/operaton-process-engine-api

jobs:
  
  bruno:
    name: Bruno end-to-end scenarios
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18.4
        env:
          POSTGRES_DB: bikeleasing
          POSTGRES_USER: admin
          POSTGRES_PASSWORD: admin
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U admin -d bikeleasing" --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up JDK 21
        uses: actions/setup-java@v5.6.0
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: '22'

      # spring-boot:run resolves the test-scope common-architecture-tests dependency, so the
      # reactor must be installed first.
      - name: Build the reactor (skip tests)
        run: ./mvnw -B -ntp -DskipTests install

      - name: Start the application
        run: ./mvnw -B -ntp -pl service/app spring-boot:run > app.log 2>&1 &

      - name: Wait for the engine to be ready
        run: |
          for i in $(seq 1 60); do
            if curl -sf http://localhost:8080/engine-rest/engine > /dev/null; then
              echo "Engine is up"; exit 0
            fi
            sleep 3
          done
          echo "Engine did not start in time"; tail -n 200 app.log; exit 1

      - name: Run Bruno scenarios
        working-directory: examples/operaton-process-engine-api/bruno
        run: npx --yes @usebruno/cli@4.0.0 run . --env local -r --exclude-tags=demo-data

      - name: Dump application log on failure
        if: failure()
        run: tail -n 300 app.log
