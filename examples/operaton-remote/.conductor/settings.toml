"$schema" = "https://conductor.build/schemas/settings.repo.schema.json"

[scripts]
run_mode = "nonconcurrent"

# One-time setup per workspace: install BPMN linting tooling (root package.json) and the pre-commit hook.
setup = "npm ci && npm run hooks:install"

# Tear down the local Postgres container when a workspace is archived.
archive = "docker compose -f stack/docker-compose.yml down -v || true"

[scripts.run.infra]
command = "docker compose -f stack/docker-compose.yml up"

[scripts.run.engine]
command = "mvn -pl service/engine-service spring-boot:run"

[scripts.run.backend]
command = "mvn -pl service/example-service spring-boot:run"

[scripts.run.test]
command = "mvn verify"

[scripts.run.smoke]
command = "cd bruno && npx --yes @usebruno/cli@4.0.0 run . --env local -r"
