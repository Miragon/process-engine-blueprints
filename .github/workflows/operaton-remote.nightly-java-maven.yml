# Generated by `npm run generate` from examples/operaton-remote/.github/workflows/nightly-java-maven.yml. Do not edit: change the source and regenerate.
name: operaton-remote · Nightly Checks · Java/Maven

on:
  workflow_call: {}
defaults:
  run:
    working-directory: examples/operaton-remote
jobs:
  mutation:
    name: Full mutation testing (PIT, gate 80)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up JDK 21
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Run PIT mutation testing
        working-directory: examples/operaton-remote/java-maven
        run: ./mvnw -B -ntp -pl service/example-service -am test-compile org.pitest:pitest-maven:mutationCoverage

      - name: Upload mutation report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: operaton-remote-pitest-report-java-maven
          path: examples/operaton-remote/java-maven/service/example-service/target/pit-reports
          if-no-files-found: warn
