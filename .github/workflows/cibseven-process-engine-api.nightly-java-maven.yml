name: cibseven-process-engine-api · Nightly Checks · Java/Maven

on:
  workflow_call: {}
defaults:
  run:
    working-directory: examples/cibseven-process-engine-api
jobs:
  mutation:
    name: Full mutation testing (PIT, gate 80)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up JDK 21
        uses: actions/setup-java@v6.1.0
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Run PIT mutation testing
        working-directory: examples/cibseven-process-engine-api/java-maven
        run: ./mvnw -B -pl service/app -am test-compile pitest:mutationCoverage

      - name: Upload mutation report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: cibseven-process-engine-api-pitest-report-java-maven
          path: examples/cibseven-process-engine-api/java-maven/service/app/target/pit-reports
          if-no-files-found: warn
