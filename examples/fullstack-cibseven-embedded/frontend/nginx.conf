# Serves the built SPA and reverse-proxies the backend paths to the `app` service (compose DNS name).
# The proxied prefixes are exactly the set the Vite dev proxy forwards (see frontend/vite.config.ts),
# so production and dev share one origin with no CORS on the request path.

upstream backend {
    server app:8080;
}

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Backend REST API, engine REST, CIB seven Cockpit/webapps, and the OpenAPI spec — everything the
    # browser calls same-origin. Longest-prefix wins, so these beat the SPA fallback below.
    location /api          { proxy_pass http://backend; }
    location /engine-rest  { proxy_pass http://backend; }
    location /camunda      { proxy_pass http://backend; }
    location /v3/api-docs  { proxy_pass http://backend; }

    # Client-side routing: unknown paths (e.g. /aufgaben, /applications/:id) resolve to the SPA shell.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Forward the usual proxy headers so the backend/Cockpit see the real client and scheme.
    # Use $http_host (the original Host *including* the port), not $host (port-stripped): the CIB seven
    # webapp builds absolute redirect URLs from the Host header, so with $host the Cockpit would bounce
    # the browser to http://localhost/camunda/ (port 80) instead of :8090 and fail to load.
    proxy_set_header Host              $http_host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
}
