server:
  port: 8081

spring:
  datasource:
    # Overridable via SPRING_DATASOURCE_* env vars for containerized/remote runs; the defaults target
    # the local dev Postgres (stack/docker-compose.yml). See CONTRIBUTING.md "Run it in containers".
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/bikeleasing}
    username: ${SPRING_DATASOURCE_USERNAME:admin}
    password: ${SPRING_DATASOURCE_PASSWORD:admin}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      # Flyway owns the schema (resources/db/migration); Hibernate only validates the entities against it.
      ddl-auto: validate
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
  mvc:
    problemdetails:
      enabled: true
  temporal:
    workers-auto-discovery:
      packages: io.miragon.blueprint

# The Temporal connection (localhost:7233, overridable with TEMPORAL_ADDRESS) and the data converter are
# contributed by the common-temporal module (temporal-application.yaml + EngineAutoConfiguration).

# A minimal, deploy/ops-ready surface. Everything else stays disabled.
management:
  endpoints:
    web:
      exposure:
        include: health, info, metrics, prometheus
  endpoint:
    health:
      probes:
        enabled: true
      # Component detail is hidden. To expose it, set: show-details: always
      show-details: never
  health:
    livenessstate:
      enabled: true
    readinessstate:
      enabled: true

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
  # Only the application's own /api/** surface is part of the published contract.
  paths-to-match: /api/**
