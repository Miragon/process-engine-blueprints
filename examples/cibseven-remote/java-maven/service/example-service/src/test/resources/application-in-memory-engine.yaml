# The integration process tests host an in-memory CIB seven engine with its /engine-rest API inside the
# worker's own test context. The worker reaches it over HTTP exactly as it reaches the remote engine.
spring:
  autoconfigure:
    exclude: []

camunda:
  bpm:
    database:
      type: h2
      schema-update: true
    job-execution:
      enabled: false
    client:
      worker-id: integration-test-worker
      lock-duration: 20000
      async-response-timeout: 500
      disable-backoff-strategy: true
