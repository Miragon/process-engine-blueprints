name: fluxnova-embedded · Nightly Checks · Kotlin/Gradle

on:
  workflow_call: {}
defaults:
  run:
    working-directory: examples/fluxnova-embedded
jobs:
  mutation:
    name: Full mutation testing (PIT, gate 80)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up JDK 21
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0

      - name: Run PIT mutation testing
        working-directory: examples/fluxnova-embedded/kotlin-gradle
        run: ./gradlew :service:app:pitest --no-daemon

      - name: Upload mutation report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: fluxnova-embedded-pitest-report-kotlin-gradle
          path: examples/fluxnova-embedded/kotlin-gradle/service/app/build/reports/pitest
          if-no-files-found: warn
