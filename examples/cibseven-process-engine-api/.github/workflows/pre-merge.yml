name: Pre-Merge Checks

on:
  pull_request:
    branches: [ main ]

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend build + contract drift
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Lint BPMN (bpmnlint)
        run: |
          npm ci
          npm run lint:bpmn

      - name: Set up JDK 21
        uses: actions/setup-java@v5.6.0
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Gradle build (arch + unit + process + model validation + spec export)
        run: ./gradlew build --no-daemon

      # The OpenAPI spec is generated by a test and committed; fail if the code and the checked-in
      # contract have drifted. See docs/adr/0003-openapi-as-the-checked-in-contract.md.
      - name: Verify the committed OpenAPI contract is in sync
        run: git diff --exit-code -- openapi/openapi.json

  mutation:
    name: Mutation testing (PIT, gate 80)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@v5.6.0
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Compute changed backend classes
        id: scope
        run: |
          CLASSES=$(git diff --name-only "${{ github.event.pull_request.base.sha }}" HEAD -- service/app/src/main/kotlin \
            | grep '\.kt$' \
            | sed -E 's#^service/app/src/main/kotlin/##; s#\.kt$##; s#/#.#g; s#$#*#' \
            | paste -sd, -)
          echo "classes=$CLASSES" >> "$GITHUB_OUTPUT"
          echo "Scoped mutation classes: ${CLASSES:-<none — pitest skipped>}"

      - name: Run PIT mutation testing (diff-scoped)
        if: steps.scope.outputs.classes != ''
        run: ./gradlew :service:app:pitest --no-daemon -PmutationTargetClasses="${{ steps.scope.outputs.classes }}"

      - name: Upload mutation report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: pitest-report
          path: service/app/build/reports/pitest
          if-no-files-found: warn

  bruno:
    name: Bruno end-to-end scenarios
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18.4
        env:
          POSTGRES_DB: bikeleasing
          POSTGRES_USER: admin
          POSTGRES_PASSWORD: admin
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U admin -d bikeleasing"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up JDK 21
        uses: actions/setup-java@v5.6.0
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: '22'

      - name: Start the application
        run: ./gradlew :service:app:bootRun --no-daemon > app.log 2>&1 &

      - name: Wait for the engine to be ready
        run: |
          for i in $(seq 1 60); do
            if curl -sf http://localhost:8080/engine-rest/engine > /dev/null; then
              echo "Engine is up"; exit 0
            fi
            sleep 3
          done
          echo "Engine did not start in time"; tail -n 200 app.log; exit 1

      - name: Run Bruno scenarios
        working-directory: bruno
        run: npx --yes @usebruno/cli@4.0.0 run . --env local -r

      - name: Dump application log on failure
        if: failure()
        run: tail -n 300 app.log
