[versions]
spring_version = "4.1.2"
spring_dependency_version = "1.1.7"
kotlin_version = "2.4.21"
kotlin_logging_version = "3.0.5"
temporal_version = "1.40.0"
archunit_version = "1.5.1"
konsist_version = "0.18.1"
springdoc_version = "3.2.0"   # 3.x = the Spring Boot 4 line; 3.0.x tracks Spring Boot 4.0.x
mockk_version = "1.14.11"
spring_mockk_version = "5.0.1"
mockito_version = "5.2.0"
kotlin_mockito_version = "6.4.0"
testcontainers_version = "2.0.5"
postgres_version = "42.7.14"
h2_version = "2.5.252"

[libraries]
# Application
web = { module = "org.springframework.boot:spring-boot-starter-web", version.ref = "spring_version" }
devtools = { module = "org.springframework.boot:spring-boot-devtools", version.ref = "spring_version" }
jpa = { module = "org.springframework.boot:spring-boot-starter-data-jpa", version.ref = "spring_version" }
postgres = { module = "org.postgresql:postgresql", version.ref = "postgres_version" }
flyway = { module = "org.springframework.boot:spring-boot-starter-flyway", version.ref = "spring_version" }
flyway-postgres = { module = "org.flywaydb:flyway-database-postgresql" }
kotlin-reflect = { module = "org.jetbrains.kotlin:kotlin-reflect", version.ref = "kotlin_version" }
kotlin_logging = { module = "io.github.microutils:kotlin-logging-jvm", version.ref = "kotlin_logging_version" }
jackson-kotlin = { module = "com.fasterxml.jackson.module:jackson-module-kotlin" }

# OpenAPI — springdoc generates the contract served at /v3/api-docs and the Swagger UI
springdoc = { module = "org.springdoc:springdoc-openapi-starter-webmvc-ui", version.ref = "springdoc_version" }

# Observability — actuator probes (health/liveness/readiness, info, metrics) and a Prometheus registry
actuator = { module = "org.springframework.boot:spring-boot-starter-actuator", version.ref = "spring_version" }
prometheus = { module = "io.micrometer:micrometer-registry-prometheus" }   # version pinned by the Spring Boot BOM

# Temporal
temporalSpringBootStarter = { module = "io.temporal:temporal-spring-boot-starter", version.ref = "temporal_version" }
temporalKotlin = { module = "io.temporal:temporal-kotlin", version.ref = "temporal_version" }

# Architecture tests
archunit = { module = "com.tngtech.archunit:archunit", version.ref = "archunit_version" }
konsist = { module = "com.lemonappdev:konsist", version.ref = "konsist_version" }

# Testing
temporalTesting = { module = "io.temporal:temporal-testing", version.ref = "temporal_version" }
spring_test = { module = "org.springframework.boot:spring-boot-starter-test", version.ref = "spring_version" }
spring_webTest = { module = "org.springframework.boot:spring-boot-webmvc-test", version.ref = "spring_version" }
spring_dataJpaTest = { module = "org.springframework.boot:spring-boot-starter-data-jpa-test", version.ref = "spring_version" }
mockito = { module = "org.mockito:mockito-inline", version.ref = "mockito_version" }
kotlin_mockito = { module = "org.mockito.kotlin:mockito-kotlin", version.ref = "kotlin_mockito_version" }
mockk = { module = "io.mockk:mockk", version.ref = "mockk_version" }
spring_mockk = { module = "com.ninja-squad:springmockk", version.ref = "spring_mockk_version" }
testcontainers = { module = "org.testcontainers:testcontainers", version.ref = "testcontainers_version" }
h2 = { module = "com.h2database:h2", version.ref = "h2_version" }
junitPlatformLauncher = { module = "org.junit.platform:junit-platform-launcher", version = "6.1.3" }

[bundles]
defaultService = ["kotlin-reflect", "kotlin_logging", "jackson-kotlin", "devtools", "web", "temporalSpringBootStarter", "temporalKotlin", "actuator", "prometheus"]
database = ["jpa", "postgres", "flyway", "flyway-postgres"]
test = ["spring_test", "spring_webTest", "spring_dataJpaTest", "mockito", "mockk", "spring_mockk", "kotlin_mockito", "testcontainers"]
archunit = ["archunit"]
konsist = ["konsist"]
temporalTesting = ["temporalTesting", "h2"]

[plugins]
kotlin-jvm = { id = "org.jetbrains.kotlin.jvm", version.ref = "kotlin_version" }
kotlin-spring = { id = "org.jetbrains.kotlin.plugin.spring", version.ref = "kotlin_version" }
kotlin-jpa = { id = "org.jetbrains.kotlin.plugin.jpa", version.ref = "kotlin_version" }
kotlin-kapt = { id = "org.jetbrains.kotlin.kapt", version.ref = "kotlin_version" }
springframework = { id = "org.springframework.boot", version.ref = "spring_version" }
spring-dependency = { id = "io.spring.dependency-management", version.ref = "spring_dependency_version" }
pitest = { id = "info.solidsoft.pitest", version = "1.19.0" }
