camunda:
  client:
    mode: self-managed
    prefer-rest-over-grpc: false
    rest-address: http://localhost:8080
    grpc-address: http://localhost:26500
    enabled: true
    # A message that finds no subscription is dropped after this time. The process-engine-api has no
    # per-message TTL, so the client default sets it (10s, as zeebe-native publishes its messages).
    message-time-to-live: PT10S
    auth:
      method: none