# Generated by `npm run generate` from examples/*/blueprint.yaml. Do not edit: change the source and regenerate.
name: CI
on:
  pull_request:
    branches:
      - main
concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  changes:
    name: Select the examples to check
    runs-on: ubuntu-latest
    outputs:
      examples: ${{ steps.select.outputs.examples }}
      variants: ${{ steps.select.outputs.variants }}
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Install the maintainer tooling
        run: npm ci
      - name: Select examples and variants by the changed paths
        id: select
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |-
          selection=$(node scripts/changed-examples.mjs "$BASE_SHA" HEAD)
          echo "$selection"
          echo "$selection" >> "$GITHUB_OUTPUT"
  generated:
    name: Generated files and cross-example drift
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Install the maintainer tooling
        run: npm ci
      - name: Verify the generated files are in sync with examples/*/blueprint.yaml
        run: npm run generate:check
      - name: Verify the copies across examples have not drifted (drift.yml)
        run: npm run drift
      - name: Verify no hard-coded owner outside the owner setting
        run: scripts/check-owner.sh
  tooling:
    name: Tooling tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Install the maintainer tooling
        run: npm ci
      - name: Test the generator and the starter CLI
        run: npm test
  cibseven-embedded--pre-merge-java-maven:
    name: cibseven-embedded · Pre-Merge Checks · Java/Maven
    needs: changes
    if: contains(fromJSON(needs.changes.outputs.variants), 'cibseven-embedded/java-maven')
    uses: ./.github/workflows/cibseven-embedded.pre-merge-java-maven.yml
  cibseven-embedded--pre-merge-kotlin-gradle:
    name: cibseven-embedded · Pre-Merge Checks · Kotlin/Gradle
    needs: changes
    if: contains(fromJSON(needs.changes.outputs.variants), 'cibseven-embedded/kotlin-gradle')
