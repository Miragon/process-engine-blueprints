# Generated by `npm run generate` from examples/cibseven-embedded/.github/workflows/nightly-kotlin-gradle.yml. Do not edit: change the source and regenerate.
name: cibseven-embedded · Nightly Checks · Kotlin/Gradle

on:
  workflow_call: {}
defaults:
  run:
    working-directory: examples/cibseven-embedded
jobs:
  mutation:
    name: Domain mutation testing (PIT, gate 80)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up JDK 21
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1

      - name: Run PIT mutation testing
        working-directory: examples/cibseven-embedded/kotlin-gradle
        run: ./gradlew :service:app:pitest --no-daemon

      - name: Upload mutation report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: cibseven-embedded-pitest-report-kotlin-gradle
          path: examples/cibseven-embedded/kotlin-gradle/service/app/build/reports/pitest
          if-no-files-found: warn

  bruno:
    name: Bruno end-to-end scenarios
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18.4
        env:
          POSTGRES_DB: bikeleasing
          POSTGRES_USER: admin
          POSTGRES_PASSWORD: admin
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U admin -d bikeleasing" --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up JDK 21
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0

      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'

      - name: Start the application
        working-directory: examples/cibseven-embedded/kotlin-gradle
        run: (./gradlew :service:app:bootRun --no-daemon) > "$GITHUB_WORKSPACE/examples/cibseven-embedded/app.log" 2>&1 &

      - name: Wait for the engine to be ready
        run: |
          for i in $(seq 1 100); do
            if curl -sf http://localhost:8081/engine-rest/engine > /dev/null; then
              echo "Engine is up"; exit 0
            fi
            sleep 3
          done
          echo "Engine did not start in time"; tail -n 200 app.log; exit 1

      - name: Run Bruno scenarios
        working-directory: examples/cibseven-embedded/bruno
        run: npx --yes @usebruno/cli@4.0.0 run . --env local -r --exclude-tags=demo-data

      - name: Dump application log on failure
        if: failure()
        run: tail -n 300 app.log
