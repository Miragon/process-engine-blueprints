# Generated by `npm run generate` from examples/cibseven-embedded/.github/workflows/nightly-java-maven.yml. Do not edit: change the source and regenerate.
name: cibseven-embedded · Nightly Checks · Java/Maven

on:
  workflow_call: {}
defaults:
  run:
    working-directory: examples/cibseven-embedded
jobs:
  mutation:
    name: Full mutation testing (PIT, gate 80)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up JDK 21
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Run PIT mutation testing
        working-directory: examples/cibseven-embedded/java-maven
        run: ./mvnw -B -ntp -pl service/app -am test-compile org.pitest:pitest-maven:mutationCoverage

      - name: Upload mutation report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: cibseven-embedded-pitest-report-java-maven
          path: examples/cibseven-embedded/java-maven/service/app/target/pit-reports
          if-no-files-found: warn
