# Generated by `npm run generate` from examples/*/.conductor/settings.toml. Do not edit: change the source and regenerate.
"$schema" = "https://conductor.build/schemas/settings.repo.schema.json"

[scripts]
run_mode = "nonconcurrent"
setup = "npm ci\nnpm run hooks:install\n"
archive = "(cd examples/cibseven-embedded && docker compose -f stack/docker-compose.yml down -v || true)\n(cd examples/cibseven-process-engine-api && docker compose -f stack/docker-compose.yml down -v || true)\n(cd examples/cibseven-remote && docker compose -f stack/docker-compose.yml down -v || true)\n(cd examples/fluxnova-embedded && docker compose -f stack/docker-compose.yml down -v || true)\n(cd examples/fullstack-cibseven-embedded && docker compose -f stack/docker-compose.yml down -v || true)\n(cd examples/operaton-embedded && docker compose -f stack/docker-compose.yml down -v || true)\n(cd examples/operaton-process-engine-api && docker compose -f stack/docker-compose.yml down -v || true)\n(cd examples/operaton-remote && docker compose -f stack/docker-compose.yml down -v || true)\n(cd examples/zeebe-native && docker compose -f stack/docker-compose.yml down -v || true)\n(cd examples/zeebe-vanillabp && docker compose -f stack/docker-compose.yml down -v || true)\n"

[scripts.run."cibseven-embedded:setup"]
command = "cd examples/cibseven-embedded && npm ci"
icon = "download"

[scripts.run."cibseven-embedded:infra"]
command = "cd examples/cibseven-embedded && docker compose -f stack/docker-compose.yml up"
icon = "database"

[scripts.run."cibseven-embedded:backend-kotlin"]
command = "cd examples/cibseven-embedded && cd kotlin-gradle && ./gradlew :service:app:bootRun"
icon = "play"

[scripts.run."cibseven-embedded:test-kotlin"]
command = "cd examples/cibseven-embedded && cd kotlin-gradle && ./gradlew build"
icon = "check"

[scripts.run."cibseven-embedded:backend-java"]
command = "cd examples/cibseven-embedded && cd java-maven && ./mvnw -DskipTests install && ./mvnw -pl service/app spring-boot:run"
icon = "play"

[scripts.run."cibseven-embedded:test-java"]
command = "cd examples/cibseven-embedded && cd java-maven && ./mvnw verify"
icon = "check"

[scripts.run."cibseven-embedded:smoke"]
command = "cd examples/cibseven-embedded && cd bruno && npx --yes @usebruno/cli@4.0.0 run . --env local -r"
icon = "flask"

