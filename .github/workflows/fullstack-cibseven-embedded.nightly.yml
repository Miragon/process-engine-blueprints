# Generated by `npm run generate` from examples/fullstack-cibseven-embedded/.github/workflows/nightly.yml. Do not edit: change the source and regenerate.
name: fullstack-cibseven-embedded · Nightly Checks

on:
  workflow_call: {}
defaults:
  run:
    working-directory: examples/fullstack-cibseven-embedded
jobs:
  mutation:
    name: Full mutation testing (PIT, gate 80)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up JDK 21
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1

      - name: Run PIT mutation testing
        run: ./gradlew :service:app:pitest --no-daemon

      - name: Upload mutation report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: fullstack-cibseven-embedded-pitest-report
          path: examples/fullstack-cibseven-embedded/service/app/build/reports/pitest
          if-no-files-found: warn

  e2e-cross-browser:
    name: Playwright across chromium/firefox/webkit
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        browser: [ chromium, firefox, webkit ]
    services:
      postgres:
        image: postgres:18.4
        env:
          POSTGRES_DB: bikeleasing
          POSTGRES_USER: admin
          POSTGRES_PASSWORD: admin
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U admin -d bikeleasing" --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up JDK 21
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1

      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: examples/fullstack-cibseven-embedded/frontend/.nvmrc
          cache: npm
          cache-dependency-path: examples/fullstack-cibseven-embedded/frontend/package-lock.json

      - name: Install frontend dependencies
        run: npm --prefix frontend ci

      - name: Install Playwright browser
        run: npm --prefix frontend exec -- playwright install --with-deps ${{ matrix.browser }}

      - name: Start the application
        run: ./gradlew :service:app:bootRun --no-daemon > app.log 2>&1 &

      - name: Wait for the engine to be ready
        run: |
          for i in $(seq 1 60); do
            if curl -sf http://localhost:8080/engine-rest/engine > /dev/null; then exit 0; fi
            sleep 3
          done
          echo "Engine did not start in time"; tail -n 200 app.log; exit 1

      - name: Start the Vite dev server
        run: npm --prefix frontend run dev > vite.log 2>&1 &

      - name: Wait for the frontend to be ready
        run: |
          for i in $(seq 1 30); do
            if curl -sf http://localhost:5173 > /dev/null; then exit 0; fi
            sleep 2
          done
          echo "Vite did not start in time"; tail -n 100 vite.log; exit 1

      - name: Run Playwright specs
        working-directory: examples/fullstack-cibseven-embedded/frontend
        run: npx playwright test --project=${{ matrix.browser }}
