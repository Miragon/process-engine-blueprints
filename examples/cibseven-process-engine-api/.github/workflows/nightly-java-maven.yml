name: Nightly Checks · Java/Maven

on:
  schedule:
    - cron: '0 3 * * *'
  workflow_dispatch:

jobs:
  mutation:
    name: Full mutation testing (PIT, gate 80)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up JDK 21
        uses: actions/setup-java@v6.0.1
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Run PIT mutation testing
        working-directory: java-maven
        run: ./mvnw -B -pl service/app -am test-compile pitest:mutationCoverage

      - name: Upload mutation report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: pitest-report-java-maven
          path: java-maven/service/app/target/pit-reports
          if-no-files-found: warn
