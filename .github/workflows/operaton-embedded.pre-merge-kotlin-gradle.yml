# Generated by `npm run generate` from examples/operaton-embedded/.github/workflows/pre-merge-kotlin-gradle.yml. Do not edit: change the source and regenerate.
name: operaton-embedded · Pre-Merge Checks · Kotlin/Gradle

on:
  workflow_call: {}
defaults:
  run:
    working-directory: examples/operaton-embedded

jobs:
  
  bruno:
    name: Bruno end-to-end scenarios
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18.4
        env:
          POSTGRES_DB: bikeleasing
          POSTGRES_USER: admin
          POSTGRES_PASSWORD: admin
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U admin -d bikeleasing" --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up JDK 21
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'

      - name: Start the application
        working-directory: examples/operaton-embedded/kotlin-gradle
        run: (./gradlew :service:app:bootRun --no-daemon) > "$GITHUB_WORKSPACE/examples/operaton-embedded/app.log" 2>&1 &

      - name: Wait for the engine to be ready
        run: |
          for i in $(seq 1 100); do
            if curl -sf http://localhost:8080/engine-rest/engine > /dev/null; then
              echo "Engine is up"; exit 0
            fi
            sleep 3
          done
          echo "Engine did not start in time"; tail -n 200 app.log; exit 1

      - name: Run Bruno scenarios
        working-directory: examples/operaton-embedded/bruno
        run: npx --yes @usebruno/cli@4.0.0 run . --env local -r --exclude-tags=demo-data

      - name: Dump application log on failure
        if: failure()
        run: tail -n 300 app.log
