name: Nightly Checks

on:
  schedule:
    - cron: '0 3 * * *'
  workflow_dispatch:

jobs:
  mutation:
    name: Full mutation testing (PIT, gate 80)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up JDK 21
        uses: actions/setup-java@v5.6.0
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Run PIT mutation testing
        run: ./gradlew :service:app:pitest --no-daemon

      - name: Upload mutation report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: pitest-report
          path: service/app/build/reports/pitest
          if-no-files-found: warn
